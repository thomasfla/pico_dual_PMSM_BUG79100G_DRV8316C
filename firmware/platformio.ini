; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 150000000L
board_build.ldscript = ldscripts/memmap_copy_to_ram_rp2350.ld
build_unflags = -Os
build_flags =
  -O3

; point exactly to the library ROOT that contains library.properties and src/
lib_deps =
  symlink://${sysenv.HOME}/Arduino/libraries/Arduino-FOC
; helps LDF resolve nested includes
lib_ldf_mode = deep+
