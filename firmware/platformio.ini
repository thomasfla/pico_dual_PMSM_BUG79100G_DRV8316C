; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#cc24cfef37ed22ca9f2a6aead28c2deb76c39f24
board = rpipico2
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 150000000L
board_build.ldscript = ldscripts/memmap_copy_to_ram_rp2350.ld
build_unflags = -Os
build_flags =
  -O3

; Unmodified upstream SimpleFOC 2.3.5. Board PWM/ADC support lives in src/.
lib_deps =
  https://github.com/simplefoc/Arduino-FOC.git#f5ac6522995446ee7365e61cd0e4964dea36a5da
; helps LDF resolve nested includes
lib_ldf_mode = deep+
